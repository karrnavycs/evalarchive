[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "karrnavycs-evalarchive"
version = "0.1.0"
description = "记录每次评测的配置、结果与代码版本，写入归档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "karrnavycs" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://karrnavycs.github.io"
Repository = "https://github.com/karrnavycs/evalarchive"
Issues = "https://github.com/karrnavycs/evalarchive/issues"

[project.scripts]
evalarchive = "evalarchive:main"

[tool.setuptools]
py-modules = ["evalarchive"]
